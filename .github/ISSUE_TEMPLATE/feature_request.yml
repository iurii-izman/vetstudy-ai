name: Feature request
description: Propose a beta feature or improvement.
title: "[feature] "
labels: ["enhancement", "ai:needs-context"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- ..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - web
        - telegram
        - ai
        - release
