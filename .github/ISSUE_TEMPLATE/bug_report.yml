name: Bug report
description: Report a reproducible beta defect.
title: "[bug] "
labels: ["bug", "ai:needs-context"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and why it matters.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - web
        - telegram
        - ai
        - release
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, request_id, error_category, screenshots, or output. Do not include secrets or private IDs.
