name: vetstudy

x-app-common: &app-common
  image: vetstudy/app:local
  pull_policy: never
  env_file:
    - path: .env
      format: raw
  volumes:
    - ./:/app
  restart: unless-stopped
  labels:
    com.vetstudy.project: "vetstudy"
    com.vetstudy.stack: "beta"

services:
  backend:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    labels:
      com.vetstudy.project: "vetstudy"
      com.vetstudy.stack: "beta"
      com.vetstudy.role: "backend"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()\""]
      interval: 20s
      timeout: 5s
      retries: 10

  bot:
    <<: *app-common
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "python -m app.run_polling"
    labels:
      com.vetstudy.project: "vetstudy"
      com.vetstudy.stack: "beta"
      com.vetstudy.role: "bot"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, os, urllib.request; token = os.getenv('TELEGRAM_BOT_TOKEN', ''); assert token; url = f'https://api.telegram.org/bot{token}/getMe'; data = json.loads(urllib.request.urlopen(url, timeout=10).read().decode()); assert data.get('ok') is True\"",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  media-worker:
    <<: *app-common
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python -m app.media.worker"
    labels:
      com.vetstudy.project: "vetstudy"
      com.vetstudy.stack: "beta"
      com.vetstudy.role: "media-worker"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.media.worker --diagnose --fail-on-stall"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: vetstudy/pgvector:pg16-local
    pull_policy: never
    environment:
      POSTGRES_DB: vetstudy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      com.vetstudy.project: "vetstudy"
      com.vetstudy.stack: "beta"
      com.vetstudy.role: "db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetstudy"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: vetstudy/redis:7-alpine-local
    pull_policy: never
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    labels:
      com.vetstudy.project: "vetstudy"
      com.vetstudy.stack: "beta"
      com.vetstudy.role: "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
